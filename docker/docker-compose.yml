services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ladder_dev
      POSTGRES_USER: ladder
      POSTGRES_PASSWORD: ladder_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ladder']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
